services:
  - type: web
    name: feduwo-agri-firm
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://feduwo-agri-firm.onrender.com
      - key: SITE_URL
        value: https://feduwo-agri-firm.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
